<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Whispr">
  <meta name="theme-color" content="#0a0b0f">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="manifest" href="manifest.json">
  <title>Whispr</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <!-- ═══ EKRAN GŁÓWNY ═══ -->
  <section id="tab-home" class="tab active">

    <header class="home-header">
      <div class="logo-row">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
            <rect x="9" y="2" width="6" height="12" rx="3"/>
            <path d="M5 10a7 7 0 0014 0" stroke-linecap="round"/>
            <line x1="12" y1="19" x2="12" y2="22" stroke-linecap="round"/>
          </svg>
        </div>
        <span class="logo-text">Whispr</span>
        <span class="logo-date" id="logo-date"></span>
      </div>
      <div class="search-bar" id="search-bar-home">
        <svg class="search-bar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="10.5" cy="10.5" r="6"/><line x1="15" y1="15" x2="20" y2="20"/></svg>
        <span class="search-bar-placeholder">Szukaj w notatkach...</span>
        <button class="search-mic-btn" id="voice-search-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0014 0"/></svg>
        </button>
      </div>
    </header>

    <div class="record-zone">
      <div class="record-outer" id="record-outer">
        <div class="record-pulse" id="record-pulse"></div>
        <button class="record-btn" id="record-btn">
          <svg id="icon-mic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3">
            <rect x="9" y="2" width="6" height="12" rx="3"/>
            <path d="M5 10a7 7 0 0014 0"/>
            <line x1="12" y1="19" x2="12" y2="22" stroke-linecap="round"/>
            <line x1="9" y1="22" x2="15" y2="22" stroke-linecap="round"/>
          </svg>
          <svg id="icon-stop" viewBox="0 0 24 24" fill="none" style="display:none">
            <rect x="7" y="7" width="10" height="10" rx="2" fill="currentColor"/>
          </svg>
        </button>
      </div>
      <div class="timer-block">
        <div class="timer" id="timer">0:00</div>
        <div class="record-hint" id="record-hint">Dotknij aby nagrać</div>
      </div>
      <canvas id="wave-canvas" width="220" height="32" class="wave-canvas"></canvas>
    </div>

    <div class="live-zone" id="live-zone">
      <div class="live-header-row">
        <span class="live-dot-anim"></span>
        <span class="live-label">NA ŻYWO</span>
      </div>
      <div class="live-content" id="live-text">Zacznij mówić...</div>
    </div>

    <div class="error-box" id="error-box" style="display:none"></div>

    <nav class="bottom-nav">
      <button class="bnav active" data-tab="home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0014 0"/></svg>
        <span>Nagraj</span>
      </button>
      <button class="bnav" data-tab="notes">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="4" y="4" width="16" height="16" rx="2"/><line x1="8" y1="9" x2="16" y2="9"/><line x1="8" y1="13" x2="13" y2="13"/></svg>
        <span>Moje Myśli</span>
      </button>
    </nav>
  </section>

  <!-- ═══ MOJE MYŚLI ═══ -->
  <section id="tab-notes" class="tab">
    <header class="notes-header">
      <h1 class="notes-title">Moje Myśli</h1>
      <div class="notes-header-btns">
        <button class="hdr-btn" id="import-btn" title="Importuj">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/></svg>
          <input type="file" id="import-file" accept=".txt" style="display:none">
        </button>
        <button class="hdr-btn" id="export-btn" title="Eksportuj">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="7 16 12 21 17 16"/><line x1="12" y1="21" x2="12" y2="9"/><path d="M3 9V5a2 2 0 012-2h14a2 2 0 012 2v4"/></svg>
        </button>
      </div>
    </header>

    <div class="notes-search-wrap">
      <div class="notes-search-bar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="10.5" cy="10.5" r="6"/><line x1="15" y1="15" x2="20" y2="20"/></svg>
        <input type="text" id="notes-search-input" placeholder="Szukaj...">
        <button class="filter-btn" id="filter-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="4" y1="6" x2="20" y2="6"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="11" y1="18" x2="13" y2="18"/></svg>
        </button>
      </div>
      <div class="filters-panel" id="filters-panel" style="display:none">
        <div class="filter-row"><label>Kategoria</label><select id="filter-cat"><option value="">Wszystkie</option></select></div>
        <div class="filter-row"><label>Status</label><select id="filter-status"><option value="">Wszystkie</option><option value="pending">Do weryfikacji</option><option value="ok">Zatwierdzone</option></select></div>
        <div class="filter-row"><label>Od</label><input type="date" id="filter-from"></div>
        <div class="filter-row"><label>Do</label><input type="date" id="filter-to"></div>
        <button class="filter-clear" id="filter-clear">Wyczyść</button>
      </div>
    </div>

    <div class="notes-body" id="notes-body">
      <!-- Nieprzypisane -->
      <div class="pending-section" id="pending-section" style="display:none">
        <div class="pending-header">
          <div class="pending-dot"></div>
          <span class="pending-label">Do weryfikacji</span>
          <span class="pending-count" id="pending-count">0</span>
          <button class="bulk-assign-btn" id="bulk-assign-btn">Przypisz wszystkie</button>
        </div>
        <div class="pending-notes" id="pending-notes"></div>
      </div>

      <!-- Siatka kategorii -->
      <div class="cat-pills-grid" id="cat-pills-grid"></div>

      <!-- Zawartość wybranej kategorii -->
      <div class="cat-content" id="cat-content" style="display:none">
        <div class="cat-content-header">
          <button class="cat-back-btn" id="cat-back-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="15 18 9 12 15 6"/></svg>
          </button>
          <span class="cat-content-title" id="cat-content-title"></span>
        </div>
        <div class="cat-subcats" id="cat-subcats"></div>
        <div class="cat-notes-list" id="cat-notes-list"></div>
        <button class="add-subcat-btn" id="add-subcat-btn">+ dodaj podkategorię</button>
      </div>

      <!-- Dodaj kategorię -->
      <button class="add-cat-pill" id="add-cat-btn">+ kategoria</button>
    </div>

    <nav class="bottom-nav">
      <button class="bnav" data-tab="home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0014 0"/></svg>
        <span>Nagraj</span>
      </button>
      <button class="bnav active" data-tab="notes">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="4" y="4" width="16" height="16" rx="2"/><line x1="8" y1="9" x2="16" y2="9"/><line x1="8" y1="13" x2="13" y2="13"/></svg>
        <span>Moje Myśli</span>
      </button>
    </nav>
  </section>

  <!-- ═══ SZUKAJ ═══ -->
  <section id="tab-search" class="tab">
    <header class="notes-header">
      <button class="back-btn" data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="15 18 9 12 15 6"/></svg></button>
      <h1 class="notes-title">Szukaj</h1>
    </header>
    <div class="search-full-wrap">
      <input type="text" id="search-full-input" placeholder="Wpisz frazę...">
      <button class="search-mic-full" id="voice-search-full">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0014 0"/></svg>
      </button>
    </div>
    <div class="search-results" id="search-results"><div class="empty-state">Wpisz frazę aby przeszukać</div></div>
    <nav class="bottom-nav">
      <button class="bnav" data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0014 0"/></svg><span>Nagraj</span></button>
      <button class="bnav" data-tab="notes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="4" y="4" width="16" height="16" rx="2"/><line x1="8" y1="9" x2="16" y2="9"/><line x1="8" y1="13" x2="13" y2="13"/></svg><span>Moje Myśli</span></button>
    </nav>
  </section>

  <!-- MODALS -->
  <div class="modal-overlay" id="modal-subcat" style="display:none">
    <div class="modal-box">
      <div class="modal-title">Nowa podkategoria</div>
      <select class="modal-select" id="subcat-cat"></select>
      <select class="modal-select" id="subcat-sub" style="display:none"></select>
      <input class="modal-input" id="subcat-name" placeholder="Nazwa...">
      <div class="modal-btns"><button class="mbtn-cancel" id="subcat-cancel">Anuluj</button><button class="mbtn-ok" id="subcat-ok">Dodaj</button></div>
    </div>
  </div>

  <div class="modal-overlay" id="modal-addcat" style="display:none">
    <div class="modal-box">
      <div class="modal-title">Nowa kategoria</div>
      <input class="modal-input" id="addcat-name" placeholder="Nazwa kategorii...">
      <div class="modal-btns"><button class="mbtn-cancel" id="addcat-cancel">Anuluj</button><button class="mbtn-ok" id="addcat-ok">Dodaj</button></div>
    </div>
  </div>

  <div class="modal-overlay" id="modal-assign" style="display:none">
    <div class="modal-box">
      <div class="modal-title">Przypisz do kategorii</div>
      <select class="modal-select" id="assign-cat"></select>
      <select class="modal-select" id="assign-sub" style="display:none"></select>
      <select class="modal-select" id="assign-subsub" style="display:none"></select>
      <div class="modal-btns"><button class="mbtn-cancel" id="assign-cancel">Anuluj</button><button class="mbtn-ok" id="assign-ok">Przypisz</button></div>
    </div>
  </div>

  <div class="modal-overlay" id="modal-bulk" style="display:none">
    <div class="modal-box">
      <div class="modal-title">Przypisz wszystkie nieprzypisane</div>
      <select class="modal-select" id="bulk-cat"></select>
      <select class="modal-select" id="bulk-sub" style="display:none"></select>
      <div class="modal-btns"><button class="mbtn-cancel" id="bulk-cancel">Anuluj</button><button class="mbtn-ok" id="bulk-ok">Przypisz</button></div>
    </div>
  </div>

</div>
<script src="app.js"></script>
<script>
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
}
</script>
</body>
</html>
