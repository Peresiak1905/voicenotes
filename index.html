<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notatnik Głosowy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Sora:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="app">

    <aside class="sidebar">
      <div class="sidebar-top">
        <div class="logo">
          <span class="logo-dot"></span>
          <span class="logo-text">VoiceNote</span>
        </div>
        <nav class="nav">
          <button class="nav-btn active" data-tab="record">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="9" opacity=".3"/></svg>
            Nagraj
          </button>
          <button class="nav-btn" data-tab="notes">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="4" y="4" width="16" height="16" rx="2"/><line x1="8" y1="9" x2="16" y2="9"/><line x1="8" y1="13" x2="13" y2="13"/></svg>
            Notatki
          </button>
          <button class="nav-btn" data-tab="search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="10.5" cy="10.5" r="6"/><line x1="15" y1="15" x2="20" y2="20"/></svg>
            Szukaj
          </button>
        </nav>
      </div>

      <div class="sidebar-cats">
        <div class="cats-label">Kategorie</div>
        <div id="sidebar-cat-list"></div>
        <button class="add-cat-btn" id="add-cat-btn">+ dodaj kategorię</button>
      </div>

      <div class="sidebar-stats">
        <div class="stat-row"><span id="s-total">0</span> nagrań</div>
        <div class="stat-row pending-row"><span id="s-pending">0</span> do weryfikacji</div>
        <div class="stat-row"><span id="s-today">0</span> dzisiaj</div>
      </div>
    </aside>

    <main class="main">

      <!-- TAB: RECORD -->
      <section id="tab-record" class="tab active">
        <div class="record-header">
          <h2>Nowe nagranie</h2>
          <div class="date-chip" id="date-chip"></div>
        </div>

        <div class="record-center">
          <div class="record-ring" id="record-ring">
            <button class="record-btn" id="record-btn" title="Kliknij aby nagrać">
              <div class="record-icon" id="record-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" id="icon-mic">
                  <rect x="9" y="2" width="6" height="12" rx="3"/>
                  <path d="M5 10a7 7 0 0014 0"/>
                  <line x1="12" y1="19" x2="12" y2="22"/>
                  <line x1="9" y1="22" x2="15" y2="22"/>
                </svg>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" id="icon-stop" style="display:none">
                  <rect x="6" y="6" width="12" height="12" rx="2"/>
                </svg>
                <div class="spinner" id="icon-spinner" style="display:none"></div>
              </div>
            </button>
          </div>

          <div class="timer" id="timer">0:00</div>

          <div class="waveform" id="waveform">
            <canvas id="wave-canvas" width="240" height="48"></canvas>
          </div>

          <div class="record-status" id="record-status">Kliknij aby nagrać</div>
        </div>

        <div class="manual-cat">
          <div class="manual-cat-label">Kategoria (opcjonalnie — AI przypisze automatycznie)</div>
          <div class="cat-pills" id="cat-pills"></div>
        </div>

        <div class="add-cat-modal" id="add-cat-modal">
          <input type="text" id="new-cat-input" placeholder="Nazwa kategorii..." maxlength="30">
          <div class="modal-actions">
            <button class="modal-btn cancel" id="modal-cancel">Anuluj</button>
            <button class="modal-btn confirm" id="modal-confirm">Dodaj</button>
          </div>
        </div>

        <div class="error-box" id="error-box" style="display:none"></div>
        <div class="processing-box" id="processing-box" style="display:none">
          <div class="processing-spinner"></div>
          <div>
            <div class="processing-title">Przetwarzam nagranie...</div>
            <div class="processing-sub">Transkrypcja i klasyfikacja AI</div>
          </div>
        </div>
      </section>

      <!-- TAB: NOTES -->
      <section id="tab-notes" class="tab">
        <div class="notes-header">
          <h2>Notatki</h2>
          <div class="filter-row" id="filter-row"></div>
        </div>
        <div class="notes-list" id="notes-list"></div>
      </section>

      <!-- TAB: SEARCH -->
      <section id="tab-search" class="tab">
        <div class="search-header">
          <h2>Szukaj</h2>
          <div class="search-wrap">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="10.5" cy="10.5" r="6"/><line x1="15" y1="15" x2="20" y2="20"/></svg>
            <input type="text" class="search-input" id="search-input" placeholder="Szukaj w notatkach...">
          </div>
        </div>
        <div class="notes-list" id="search-results">
          <div class="empty-state">Wpisz frazę aby przeszukać notatki</div>
        </div>
      </section>

    </main>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
