<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Whispr">
  <meta name="theme-color" content="#0a0b0f">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="manifest" href="manifest.json">
  <title>Whispr</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <!-- ═══ EKRAN GŁÓWNY ═══ -->
  <section id="tab-home" class="tab active">

    <header class="home-header">
      <div class="logo-row">
        <h1 class="logo">Whispr<span>Wear your thoughts</span></h1>
      </div>
      <div class="stats-row">
        <div class="stat-box">
          <div class="stat-lbl">Notatki</div>
          <div class="stat-val" id="stat-total">0</div>
        </div>
        <div class="stat-box">
          <div class="stat-lbl">Kategorie</div>
          <div class="stat-val" id="stat-cats">6</div>
        </div>
      </div>
      <div class="cats-scroll" id="home-cats-scroll">
        <!-- Generowane przez JS -->
      </div>
    </header>

    <div class="notes-list" id="notes-container">
      <!-- Generowane przez JS -->
    </div>

  </section>

  <!-- ═══ EKRAN NAGRYWANIA ═══ -->
  <section id="tab-record" class="tab">
    <div class="rec-container">
      <canvas id="wave-canvas" width="240" height="60"></canvas>
      <div class="record-outer" id="record-outer">
        <button class="record-btn" id="record-btn">
          <!-- Mic icon -->
          <svg id="icon-mic" viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
          <!-- Stop icon -->
          <svg id="icon-stop" viewBox="0 0 24 24" style="display:none"><path d="M6 6h12v12H6z"/></svg>
        </button>
      </div>
      <div class="record-hint" id="record-hint">Dotknij aby nagrać</div>
    </div>
  </section>

  <!-- ═══ EKRAN KATEGORII ═══ -->
  <section id="tab-cats" class="tab">
    <button class="btn-primary" id="btn-add-cat">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      Dodaj kategorię
    </button>
    <div class="cats-grid" id="cats-container">
      <!-- Generowane przez JS -->
    </div>
  </section>

  <!-- ═══ NAWIGACJA DOLNA ═══ -->
  <nav class="bottom-nav">
    <div class="nav-item active" data-tab="home">
      <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      Lista
    </div>
    <div class="nav-item" data-tab="record">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/></svg>
      Nagraj
    </div>
    <div class="nav-item" data-tab="cats">
      <svg viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
      Kat.
    </div>
  </nav>

  <!-- MODALE -->
  <div class="modal-overlay" id="modal-addcat" style="display:none">
    <div class="modal-box">
      <div class="modal-title">Nowa kategoria</div>
      <input class="modal-input" id="addcat-name" placeholder="Nazwa kategorii...">
      <div class="modal-btns"><button class="mbtn-cancel" id="addcat-cancel">Anuluj</button><button class="mbtn-ok" id="addcat-ok">Dodaj</button></div>
    </div>
  </div>

  <div class="modal-overlay" id="modal-assign" style="display:none">
    <div class="modal-box">
      <div class="modal-title">Przypisz do kategorii</div>
      <select class="modal-select" id="assign-cat"></select>
      <select class="modal-select" id="assign-sub" style="display:none"></select>
      <select class="modal-select" id="assign-subsub" style="display:none"></select>
      <div class="modal-btns"><button class="mbtn-cancel" id="assign-cancel">Anuluj</button><button class="mbtn-ok" id="assign-ok">Przypisz</button></div>
    </div>
  </div>

  <div class="modal-overlay" id="modal-bulk" style="display:none">
    <div class="modal-box">
      <div class="modal-title">Przypisz wszystkie nieprzypisane</div>
      <select class="modal-select" id="bulk-cat"></select>
      <select class="modal-select" id="bulk-sub" style="display:none"></select>
      <div class="modal-btns"><button class="mbtn-cancel" id="bulk-cancel">Anuluj</button><button class="mbtn-ok" id="bulk-ok">Przypisz</button></div>
    </div>
  </div>

</div>

<script src="app.js"></script>
<script>
  if('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js');
  }
</script>
</body>
</html>
