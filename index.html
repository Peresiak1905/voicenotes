<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Whispr</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=DM+Sans:wght@300;400;500&family=DM+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">

  <!-- EKRAN GŁÓWNY -->
  <section id="tab-home" class="tab active">
    <div class="home-header">
      <div class="logo-wrap">
        <div class="logo-mark">
          <svg viewBox="0 0 24 24" fill="none"><rect x="9" y="2" width="6" height="12" rx="3" stroke="currentColor" stroke-width="1.2"/><path d="M5 10a7 7 0 0014 0" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/><line x1="12" y1="19" x2="12" y2="22" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
        </div>
        <span class="logo-name">Whispr</span>
      </div>
      <div class="search-pill" id="search-pill">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="10.5" cy="10.5" r="6"/><line x1="15" y1="15" x2="20" y2="20"/></svg>
        <span>Szukaj</span>
      </div>
    </div>

    <div class="record-section">
      <div class="record-outer" id="record-outer">
        <div class="record-glow" id="record-glow"></div>
        <div class="record-ring">
          <button class="record-btn" id="record-btn">
            <div class="record-btn-inner">
              <svg id="icon-mic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0014 0"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="9" y1="22" x2="15" y2="22"/></svg>
              <svg id="icon-stop" viewBox="0 0 24 24" fill="none" style="display:none"><rect x="7" y="7" width="10" height="10" rx="2" fill="currentColor"/></svg>
            </div>
          </button>
        </div>
      </div>
      <div class="timer-wrap">
        <div class="timer" id="timer">0:00</div>
        <div class="record-hint" id="record-hint">Dotknij aby nagrać</div>
      </div>
      <canvas id="wave-canvas" width="220" height="36" class="wave-canvas"></canvas>
    </div>

    <div class="live-section" id="live-section">
      <div class="live-header">
        <div class="live-dot"></div>
        <span class="live-label">Na żywo</span>
      </div>
      <div class="live-text" id="live-text">Zacznij mówić...</div>
    </div>

    <div class="error-box" id="error-box" style="display:none"></div>

    <nav class="bottom-nav">
      <button class="bnav active" data-tab="home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0014 0"/></svg>
        <span>Nagraj</span>
      </button>
      <button class="bnav" data-tab="notes">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="4" y="4" width="16" height="16" rx="2"/><line x1="8" y1="9" x2="16" y2="9"/><line x1="8" y1="13" x2="13" y2="13"/></svg>
        <span>Moje Myśli</span>
      </button>
    </nav>
  </section>

  <!-- MOJE MYŚLI -->
  <section id="tab-notes" class="tab">
    <div class="notes-header">
      <h2 class="notes-title">Moje Myśli</h2>
      <button class="export-btn" id="import-btn" title="Importuj notatki">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/><line x1="12" y1="3" x2="12" y2="15" stroke="none"/></svg>
        <input type="file" id="import-file" accept=".txt" style="display:none">
      </button>
      <button class="export-btn" id="export-btn" title="Eksportuj notatki">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      </button>
    </div>

    <div class="search-notes-wrap">
      <div class="search-notes-bar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="10.5" cy="10.5" r="6"/><line x1="15" y1="15" x2="20" y2="20"/></svg>
        <input type="text" id="notes-search-input" placeholder="Szukaj w myślach...">
        <button class="filter-toggle-btn" id="filter-toggle-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="4" y1="6" x2="20" y2="6"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="11" y1="18" x2="13" y2="18"/></svg>
        </button>
      </div>
      <div class="filters-panel" id="filters-panel" style="display:none">
        <div class="filter-row">
          <div class="filter-label">Kategoria</div>
          <select class="filter-select" id="filter-cat">
            <option value="">Wszystkie</option>
          </select>
        </div>
        <div class="filter-row">
          <div class="filter-label">Status</div>
          <select class="filter-select" id="filter-status">
            <option value="">Wszystkie</option>
            <option value="pending">Do weryfikacji</option>
            <option value="ok">Zatwierdzone</option>
          </select>
        </div>
        <div class="filter-row">
          <div class="filter-label">Data od</div>
          <input type="date" class="filter-date" id="filter-date-from">
        </div>
        <div class="filter-row">
          <div class="filter-label">Data do</div>
          <input type="date" class="filter-date" id="filter-date-to">
        </div>
        <button class="filter-clear-btn" id="filter-clear-btn">Wyczyść filtry</button>
      </div>
    </div>

    <!-- DO WERYFIKACJI -->
    <div class="pending-section" id="pending-section" style="display:none">
      <div class="section-header">
        <div class="section-dot pending-dot"></div>
        <span class="section-label">Do weryfikacji</span>
        <span class="section-count" id="pending-count">0</span>
      </div>
      <div class="notes-list" id="pending-list"></div>
    </div>

    <!-- KATEGORIE ACCORDION -->
    <div class="categories-wrap" id="categories-wrap"></div>

    <nav class="bottom-nav">
      <button class="bnav" data-tab="home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0014 0"/></svg>
        <span>Nagraj</span>
      </button>
      <button class="bnav active" data-tab="notes">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="4" y="4" width="16" height="16" rx="2"/><line x1="8" y1="9" x2="16" y2="9"/><line x1="8" y1="13" x2="13" y2="13"/></svg>
        <span>Moje Myśli</span>
      </button>
    </nav>
  </section>

  <!-- WYSZUKIWANIE -->
  <section id="tab-search" class="tab">
    <div class="notes-header">
      <button class="back-btn" data-tab="home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <h2 class="notes-title">Szukaj</h2>
    </div>
    <div class="search-full-wrap">
      <input type="text" class="search-full-input" id="search-full-input" placeholder="Wpisz frazę...">
      <button class="voice-search-btn" id="voice-search-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0014 0"/></svg>
      </button>
    </div>
    <div class="notes-scroll" id="search-results">
      <div class="empty-state">Wpisz frazę aby przeszukać notatki</div>
    </div>
    <nav class="bottom-nav">
      <button class="bnav" data-tab="home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0014 0"/></svg>
        <span>Nagraj</span>
      </button>
      <button class="bnav" data-tab="notes">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="4" y="4" width="16" height="16" rx="2"/><line x1="8" y1="9" x2="16" y2="9"/><line x1="8" y1="13" x2="13" y2="13"/></svg>
        <span>Moje Myśli</span>
      </button>
    </nav>
  </section>

  <!-- MODAL: PODKATEGORIA -->
  <div class="modal-overlay" id="subcat-modal" style="display:none">
    <div class="modal-card">
      <div class="modal-title">Nowa podkategoria</div>
      <select class="modal-select" id="subcat-parent-cat"></select>
      <select class="modal-select" id="subcat-parent-sub" style="display:none"></select>
      <input type="text" class="modal-input" id="subcat-input" placeholder="Nazwa...">
      <div class="modal-btns">
        <button class="modal-btn-cancel" id="subcat-cancel">Anuluj</button>
        <button class="modal-btn-confirm" id="subcat-confirm">Dodaj</button>
      </div>
    </div>
  </div>

  <!-- MODAL: DODAJ KATEGORIĘ -->
  <div class="modal-overlay" id="addcat-modal" style="display:none">
    <div class="modal-card">
      <div class="modal-title">Nowa kategoria</div>
      <input type="text" class="modal-input" id="addcat-input" placeholder="Nazwa kategorii...">
      <div class="modal-btns">
        <button class="modal-btn-cancel" id="addcat-cancel">Anuluj</button>
        <button class="modal-btn-confirm" id="addcat-confirm">Dodaj</button>
      </div>
    </div>
  </div>

  <!-- MODAL: PRZYPISZ NOTATKĘ -->
  <div class="modal-overlay" id="assign-modal" style="display:none">
    <div class="modal-card">
      <div class="modal-title">Przypisz do kategorii</div>
      <select class="modal-select" id="assign-cat"></select>
      <select class="modal-select" id="assign-sub" style="display:none"></select>
      <select class="modal-select" id="assign-subsub" style="display:none"></select>
      <div class="modal-btns">
        <button class="modal-btn-cancel" id="assign-cancel">Anuluj</button>
        <button class="modal-btn-confirm" id="assign-confirm">Przypisz</button>
      </div>
    </div>
  </div>

</div>
<script src="js/app.js"></script>
</body>
</html>
